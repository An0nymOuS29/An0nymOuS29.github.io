<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator</title>
  <!-- Reliable QR Code library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
      color: #1f2933;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
    p.sub { color: #6b7280; margin-top: 0; margin-bottom: 1.5rem; }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 90%;
      max-width: 420px;
      text-align: center;
    }
    #qrcode {
      margin: 1.5rem auto 0;
      display: flex;
      justify-content: center;
    }
    #qrcode img {
      margin: 0 auto;
      border-radius: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
      margin-bottom: 1rem;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.65rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Scan to Feedback</h1>
    <p class="sub">QR code points to the feedback page.</p>

    <input type="text" id="target" placeholder="Feedback page URL" />
    <button id="generate">Generate QR</button>

    <div id="qrcode"></div>
  </div>

  <script>
    // FIXED GitHub Pages server — QR always points here.
    const SERVER = "https://An0nymOuS29.github.io";
    const defaultTarget = `${SERVER}/login.html`;
    const params = new URLSearchParams(location.search);
    const targetUrl = params.get("target") || defaultTarget;
    document.getElementById("target").value = targetUrl;

    const qrContainer = document.getElementById("qrcode");
    let qrInstance = null;

    function renderQr(url) {
      qrContainer.innerHTML = "";
      qrInstance = new QRCode(qrContainer, {
        text: url,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    document.getElementById("generate").addEventListener("click", () => {
      const url = document.getElementById("target").value.trim();
      if (!url) return;
      renderQr(url);
    });

    // Initial render on load
    renderQr(targetUrl);
  </script>
</body>
</html>
