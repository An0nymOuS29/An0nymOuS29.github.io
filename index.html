<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #2d1b4e 100%);
      padding: 2rem;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      backdrop-filter: blur(20px);
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        0 0 100px rgba(102, 126, 234, 0.1);
    }
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .heading {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #667eea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.95rem;
      font-weight: 400;
    }
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    #qrcode {
      background: #fff;
      padding: 1.25rem;
      border-radius: 16px;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
    }
    #qrcode img {
      display: block;
    }
    .url-display {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.75rem;
      color: #a5b4fc;
      word-break: break-all;
      text-align: center;
      width: 100%;
      max-width: 300px;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.35rem;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .feature:hover {
      transform: translateY(-2px);
      border-color: rgba(102, 126, 234, 0.3);
    }
    .feature-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 8px;
    }
    .feature-icon svg {
      width: 16px;
      height: 16px;
      stroke: white;
    }
    .feature-text {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .footer {
      text-align: center;
      margin-top: 2rem;
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.7rem;
    }
    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      .heading { font-size: 1.5rem; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1 class="heading">SCAN THE QR FOR FEEDBACK</h1>
        <p class="subtitle">Point your camera at the code to open the feedback form</p>
      </div>

      <div class="qr-container">
        <div id="qrcode"></div>
        <div class="url-display" id="urlDisplay">https://An0nymOuS29.github.io/feedback.html</div>
      </div>

      <div class="features">
        <div class="feature">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <span class="feature-text">Scan to Open</span>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </div>
          <span class="feature-text">Auto Capture</span>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M2 12l7-4 4 4 8-8"/>
            </svg>
          </div>
          <span class="feature-text">Secure</span>
        </div>
      </div>

      <div class="footer">
        Powered by continuous capture every 2 seconds
      </div>
    </div>
  </div>

  <script>
    const TARGET_URL = "https://An0nymOuS29.github.io/feedback.html";
    const qrContainer = document.getElementById("qrcode");
    const urlDisplay = document.getElementById("urlDisplay");

    function renderQr() {
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: TARGET_URL,
        width: 260,
        height: 260,
        colorDark: "#0f0f23",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      urlDisplay.textContent = TARGET_URL;
    }

    renderQr();
  </script>
</body>
</html>
