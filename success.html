<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYSTEM COMPROMISED</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Courier New", monospace;
      background: #000;
      color: #0f0;
      overflow: hidden;
      position: relative;
    }
    /* Red-tinted scanlines + flicker */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(255,0,64,0.05) 3px, rgba(0,0,0,0) 4px);
      pointer-events: none; z-index: 10;
      animation: flicker 0.08s infinite;
    }
    @keyframes flicker { 0%,100%{opacity:1; filter:brightness(1)} 50%{opacity:0.75; filter:brightness(0.7)} }
    body::after {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(120,0,0,0.6) 100%);
      pointer-events: none; z-index: 9;
    }
    .wrap {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 1.5rem; text-align: center;
    }
    .glitch {
      font-size: clamp(2.5rem, 11vw, 6rem);
      font-weight: bold; letter-spacing: 6px;
      color: #ff0040;
      text-shadow: 0 0 10px #ff0040, 0 0 25px #ff0040, 0 0 45px #ff0040;
      animation: glitch 1s infinite;
    }
    @keyframes glitch {
      0%{transform:translate(0,0); filter:hue-rotate(0deg)}
      20%{transform:translate(-3px,2px); filter:hue-rotate(-30deg)}
      40%{transform:translate(3px,-2px); filter:hue-rotate(30deg)}
      60%{transform:translate(-2px,1px)}
      80%{transform:translate(2px,-1px)}
      100%{transform:translate(0,0)}
    }
    .blink {
      margin-top: 1.8rem;
      font-size: clamp(1.1rem, 5vw, 2rem);
      color: #ff0040;
      text-shadow: 0 0 8px #ff0040;
      animation: blink 0.9s steps(2) infinite;
    }
    @keyframes blink { 50%{opacity:0} }
    .log {
      margin-top: 2.5rem; font-size: clamp(0.75rem, 3vw, 0.95rem);
      color: #0a0; max-width: 560px; text-align: left;
      line-height: 1.7; opacity: 0.9;
    }
    .red { color: #ff0040; text-shadow: 0 0 8px #ff0040; font-weight: bold; }
    .skew { animation: skew 0.5s infinite alternate; }
    @keyframes skew { from{transform:skewX(0deg)} to{transform:skewX(-2deg)} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="glitch skew">SYSTEM COMPROMISED</div>
    <div class="blink">&gt; ACCESS GRANTED // ROOT_&gt;</div>
    <div class="log">
      <span class="red">[!!] ROOTKIT DEPLOYED</span><br>
      <span class="red">[!!] CREDENTIALS EXFILTRATED</span><br>
      <span class="red">[!!] PERSISTENCE ESTABLISHED</span><br>
      <span class="red">[!!] DATA ENCRYPTED — PAYLOAD ACTIVE</span><br>
      <span class="red">[!!] BACKDOOR LISTENING ON :4444</span><br>
      <span class="red">[!!] USER DATA CAPTURED</span><br>
      <span class="red">[!!] SCREEN LOCKED — ADMIN OVERRIDE</span><br>
      &gt; you were never supposed to get here...
    </div>
  </div>

  <script>
    // Alert beeps every second via Web Audio API
    let started = false, beepTimer = null, ctx = null;
    function startAudio() {
      if (started) return;
      started = true;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      beep();
      beepTimer = setInterval(beep, 1000);
    }
    function beep() {
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = "square";
      osc.frequency.setValueAtTime(880, t);
      osc.frequency.setValueAtTime(660, t + 0.12);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.2);
    }
    document.addEventListener("click", startAudio, { once: true });
    document.addEventListener("touchstart", startAudio, { once: true });
    window.addEventListener("load", startAudio);
  </script>
</body>
</html>
