<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Success</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
      color: #1f2933;
    }
    .card {
      background: #fff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 90%;
      max-width: 420px;
      text-align: center;
    }
    .check { font-size: 3rem; color: #16a34a; margin-bottom: 0.5rem; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p { color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">&#10004;</div>
    <h1>Login Successful</h1>
    <p>You have been redirected after a successful login.</p>
  </div>
</body>
</html>
