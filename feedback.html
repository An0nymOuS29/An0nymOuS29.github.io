<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .card h1 {
      font-size: 1.5rem;
      color: #1f2933;
      margin-bottom: 0.2rem;
    }
    .card p.sub {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .field { margin-bottom: 1.1rem; position: relative; }
    label {
      display: block;
      font-size: 0.82rem;
      color: #374151;
      margin-bottom: 0.35rem;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }
    input.invalid { border-color: #ef4444; }
    input.valid { border-color: #10b981; }
    #msg {
      color: #ef4444;
      font-size: 0.82rem;
      margin-top: 0.4rem;
      min-height: 1em;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Feedback Form</h1>
    <p class="sub">Please fill in your details.</p>

    <form id="feedbackForm" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required />
      </div>

      <div class="field">
        <label for="email">Email ID</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required />
      </div>

      <div class="field">
        <label for="collegeId">College ID</label>
        <input type="text" id="collegeId" name="collegeId" placeholder="e.g. CU2024001" required />
      </div>

      <button type="submit" id="submitBtn">Submit</button>
      <div id="msg"></div>
    </form>
  </div>

  <script>
    const SERVER = "https://An0nymOuS29.github.io";
    const NEXT_URL = SERVER + "/success.html";

    const form = document.getElementById("feedbackForm");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");

    const validateEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    const validatePhone = (v) => /^[+]?[\d\s\-()]{7,15}$/.test(v.replace(/\s/g, ""));

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      msg.textContent = "";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const collegeId = document.getElementById("collegeId").value.trim();

      let ok = true;

      const nameEl = document.getElementById("name");
      const emailEl = document.getElementById("email");
      const phoneEl = document.getElementById("phone");
      const collegeEl = document.getElementById("collegeId");

      [nameEl, emailEl, phoneEl, collegeEl].forEach(el => el.classList.remove("invalid", "valid"));

      if (!name) { nameEl.classList.add("invalid"); ok = false; }
      else nameEl.classList.add("valid");

      if (!validateEmail(email)) { emailEl.classList.add("invalid"); ok = false; }
      else emailEl.classList.add("valid");

      if (!validatePhone(phone)) { phoneEl.classList.add("invalid"); ok = false; }
      else phoneEl.classList.add("valid");

      if (!collegeId) { collegeEl.classList.add("invalid"); ok = false; }
      else collegeEl.classList.add("valid");

      if (!ok) { msg.textContent = "Please fix the highlighted fields."; return; }

      btn.disabled = true;
      btn.textContent = "Submitting...";

      // Store flag so success page knows user interacted (allows autoplay)
      sessionStorage.setItem("allow_audio", "true");

      // Success — redirect
      setTimeout(() => { window.location.href = NEXT_URL; }, 400);
    });
  </script>
</body>
</html>
